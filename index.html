<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f26b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recetario">
<style>
:root{--bg:#fff8f1;--card:#fff;--tx:#2b1d14;--mu:#8a766a;--ac:#f26b1d;--ac2:#ffe3d0;--bd:#f0e2d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--card:#261d17;--tx:#f6ebe2;--mu:#a38f82;--ac2:#3b281b;--bd:#382a20}}
:root[data-theme="dark"]{--bg:#1a1410;--card:#261d17;--tx:#f6ebe2;--mu:#a38f82;--ac2:#3b281b;--bd:#382a20}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin-inline:auto;padding:16px 16px 90px}
h1{font-size:24px;margin:4px 0 12px}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
textarea{min-height:90px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--ac2);color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:7px 14px;font-weight:500}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer}
.em{height:90px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--ac2)}
.rc div.b{padding:10px}
.rc b{display:block;font-size:15px}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto}
nav button{background:none;color:var(--mu);font-size:12px;padding:6px 14px}
nav button.on{color:var(--ac)}
nav span{display:block;font-size:20px}
.row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row.d span{text-decoration:line-through;color:var(--mu)}
.row input[type=checkbox]{width:22px;height:22px;margin:0}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.fav{background:none;font-size:22px;padding:0 4px;color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const EMO={Desayuno:'🥞',Comida:'🍝',Cena:'🥗',Postre:'🍰',Otros:'🍽️'};
const CATS=Object.keys(EMO);
let S={recipes:[
{id:1,t:'Tortitas de plátano',c:'Desayuno',min:15,kcal:320,fav:1,ing:['2 plátanos','2 huevos','50 g avena','1 pizca de canela'],pas:['Tritura todos los ingredientes.','Cocina porciones en sartén a fuego medio 2 min por lado.','Sirve con fruta.']},
{id:2,t:'Ramen rápido',c:'Comida',min:25,kcal:540,fav:0,ing:['200 g fideos','500 ml caldo','1 huevo','2 cebolletas','1 cda salsa de soja'],pas:['Hierve el huevo 7 min.','Calienta el caldo con la soja.','Cuece los fideos y monta el bol.']},
{id:3,t:'Salmón a la plancha',c:'Cena',min:20,kcal:410,fav:1,ing:['2 lomos de salmón','1 limón','Aceite de oliva','Sal y pimienta'],pas:['Sazona el salmón.','Plancha 4 min por lado.','Termina con limón.']}],
plan:{},shop:[],tab:'rec',cat:'Todas',q:'',open:null,edit:null,pw:0};
try{const s=JSON.parse(localStorage.getItem('recetario')||'null');if(s){S.recipes=s.recipes;S.plan=s.plan;S.shop=s.shop}}catch(e){}
function save(){try{localStorage.setItem('recetario',JSON.stringify({recipes:S.recipes,plan:S.plan,shop:S.shop}))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function render(){
 $('#nav').innerHTML=[['rec','📖','Recetas'],['plan','🗓️','Plan'],['shop','🛒','Compra']].map(([k,i,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.open=null;S.edit=null;render()"><span>${i}</span>${l}</button>`).join('');
 $('#app').innerHTML=S.edit!==null?editV():S.open?detV():S.tab=='rec'?listV():S.tab=='plan'?planV():shopV();
}
function listV(){
 const f=S.recipes.filter(r=>(S.cat=='Todas'||(S.cat=='★'?r.fav:r.c==S.cat))&&r.t.toLowerCase().includes(S.q.toLowerCase()));
 return `<div class="top"><h1>Mi recetario</h1><button onclick="S.edit=0;render()">+ Nueva</button></div>
 <input placeholder="Buscar recetas…" value="${esc(S.q)}" oninput="S.q=this.value;render();const i=document.querySelector('input');i.focus();i.setSelectionRange(99,99)">
 <div class="chips">${['Todas','★',...CATS].map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
 <div class="grid">${f.map(r=>`<div class="rc" onclick="S.open=${r.id};render()"><div class="em">${EMO[r.c]}</div><div class="b"><b>${esc(r.t)}</b><span class="mu">${r.min} min · ${r.kcal} kcal ${r.fav?'★':''}</span></div></div>`).join('')||'<p class="mu">Sin resultados.</p>'}</div>`;
}
function detV(){
 const r=S.recipes.find(x=>x.id==S.open);
 return `<div class="top"><button class="g" onclick="S.open=null;render()">← Volver</button><button class="fav" onclick="tog(${r.id})">${r.fav?'★':'☆'}</button></div>
 <div class="em" style="border-radius:16px;margin:12px 0">${EMO[r.c]}</div><h1>${esc(r.t)}</h1>
 <p class="mu">${r.c} · ${r.min} min · ${r.kcal} kcal</p>${r.url?`<p><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--ac)">🔗 Ver publicación original</a></p>`:''}
 <div class="sec"><b>Ingredientes</b>${r.ing.map(i=>`<div class="row"><span>${esc(i)}</span></div>`).join('')}
 <button style="margin-top:10px" onclick="addShop(${r.id})">🛒 Añadir a la compra</button></div>
 <div class="sec"><b>Pasos</b>${r.pas.map((p,i)=>`<p><b style="color:var(--ac)">${i+1}.</b> ${esc(p)}</p>`).join('')}</div>
 <div class="sec"><b>Planificar</b><div class="chips" style="margin-top:8px">${DAYS.map((d,i)=>`<button class="chip" onclick="plan(${r.id},${i})">${d}</button>`).join('')}</div></div>
 <button class="g" onclick="S.edit=${r.id};render()">Editar</button> <button class="g" onclick="del(${r.id})">Eliminar</button>`;
}
function editV(){
 const r=S.edit?S.recipes.find(x=>x.id==S.edit):{t:'',c:'Comida',min:20,kcal:0,ing:[],pas:[]};
 return `<h1>${S.edit?'Editar':'Nueva'} receta</h1>
 <div class="sec"><b>✨ Importar desde texto</b><p class="mu">Copia el texto de la publicación de TikTok, Facebook o una web y lo ordeno solo.</p><label class="g" style="display:block;text-align:center;padding:12px;border-radius:12px;margin:8px 0;cursor:pointer;background:var(--ac2);color:var(--ac);font-weight:600">📷 Importar desde captura<input type="file" accept="image/*" style="display:none" onchange="ocr(this.files[0])"></label><p id="ocrst" class="mu">Consejo: recorta la captura para que solo se vea el texto de la receta.</p>
 <textarea id="raw" placeholder="Pega aquí la descripción o los comentarios del vídeo (con o sin enlace)…"></textarea><button class="g" onclick="parse()">Ordenar</button></div>
 <input id="t" placeholder="Título" value="${esc(r.t)}">
 <input id="url" type="url" placeholder="Enlace original (TikTok, Facebook, web…)" value="${esc(r.url||'')}">
 <select id="c">${CATS.map(c=>`<option ${c==r.c?'selected':''}>${c}</option>`).join('')}</select>
 <input id="min" type="number" placeholder="Minutos" value="${r.min}"><input id="kcal" type="number" placeholder="Calorías" value="${r.kcal}">
 <textarea id="ing" placeholder="Ingredientes (uno por línea)">${esc(r.ing.join('\n'))}</textarea>
 <textarea id="pas" placeholder="Pasos (uno por línea)">${esc(r.pas.join('\n'))}</textarea>
 <button onclick="saveR(${S.edit||0})">Guardar</button> <button class="g" onclick="S.edit=null;render()">Cancelar</button>`;
}
function planV(){
 return `<h1>Plan semanal</h1>${DAYS.map((d,i)=>{const r=S.recipes.find(x=>x.id==S.plan[i]);return `<div class="sec top"><div><b>${d}</b><br><span class="mu">${r?esc(r.t):'Sin planificar'}</span></div>${r?`<div><button class="g" onclick="addShop(${r.id})">🛒</button> <button class="g" onclick="delete S.plan[${i}];save();render()">✕</button></div>`:''}</div>`}).join('')}
 <p class="mu">Elige una receta y asígnale un día desde su ficha.</p>`;
}
function shopV(){
 return `<div class="top"><h1>Lista de compra</h1><button class="g" onclick="S.shop=S.shop.filter(x=>!x.d);save();render()">Limpiar ✓</button></div>
 <div style="display:flex;gap:8px"><input id="ni" placeholder="Añadir artículo" onkeydown="if(event.key=='Enter')addI()"><button style="height:46px" onclick="addI()">+</button></div>
 ${S.shop.map((x,i)=>`<div class="row ${x.d?'d':''}"><input type="checkbox" ${x.d?'checked':''} onchange="S.shop[${i}].d=this.checked;save();render()"><span>${esc(x.n)}</span></div>`).join('')||'<p class="mu">Vacía.</p>'}`;
}
function tog(id){const r=S.recipes.find(x=>x.id==id);r.fav=r.fav?0:1;save();render()}
function del(id){if(confirm('¿Eliminar receta?')){S.recipes=S.recipes.filter(x=>x.id!=id);S.open=null;save();render()}}
function plan(id,d){S.plan[d]=id;save();S.open=null;S.tab='plan';render()}
function addShop(id){const r=S.recipes.find(x=>x.id==id);r.ing.forEach(n=>{if(!S.shop.some(x=>x.n==n))S.shop.push({n,d:false})});save();S.open=null;S.tab='shop';render()}
function addI(){const v=$('#ni').value.trim();if(v){S.shop.push({n:v,d:false});save();render()}}
function lines(id){return $(id).value.split('\n').map(s=>s.trim()).filter(Boolean)}
function saveR(id){
 const o={t:$('#t').value.trim()||'Sin título',c:$('#c').value,min:+$('#min').value||0,kcal:+$('#kcal').value||0,ing:lines('#ing'),pas:lines('#pas'),url:$('#url').value.trim()};
 if(id){Object.assign(S.recipes.find(x=>x.id==id),o)}else{S.recipes.unshift({id:Date.now(),fav:0,...o})}
 S.edit=null;save();render();
}
async function ocr(f){
 if(!f)return;const st=$('#ocrst');st.textContent='Cargando lector de texto…';
 try{
  if(!window.Tesseract)await new Promise((ok,ko)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';x.onload=ok;x.onerror=ko;document.head.appendChild(x)});
  const r=await Tesseract.recognize(f,'spa',{logger:m=>{if(m.status=='recognizing text')st.textContent='Leyendo… '+Math.round(m.progress*100)+'%'}});
  $('#raw').value=r.data.text;st.textContent='Listo. Revisa los campos antes de guardar.';parse();
 }catch(e){st.textContent='No se pudo leer la imagen. Comprueba la conexión e inténtalo de nuevo.'}
}
function parse(){
 let raw=$('#raw').value;if(!raw.trim())return;
 const um=raw.match(/https?:\/\/\S+/);if(um){$('#url').value=um[0];raw=raw.replace(/https?:\/\/\S+/g,'')}
 const clean=t=>t.replace(/#\S+/g,'').replace(/@\S+/g,'').replace(/\p{Extended_Pictographic}|\uFE0F/gu,'').replace(/^\d+[.)]\s+/,'').replace(/^[^\p{L}\p{N}¡¿]+/u,'')
  .replace(/\s+\d+([.,]\d+)?\s*mil\s*$/i,'').replace(/\s*\([a-z]{1,4}\)\s*$/i,'').replace(/\s+[vw|»«©®]$/i,'').replace(/^[A-Za-z¥]\s+(?=\p{Lu}\p{Ll})/u,'').replace(/\s+/g,' ').trim();
 const L=raw.split('\n').map(l=>l.trim()).filter(l=>l&&(l.match(/\p{L}/gu)||[]).length>=3);
 const key=l=>clean(l).toLowerCase().replace(/:/g,'');
 const isI=l=>{const k=key(l);return /ingredientes|necesitas/.test(k)&&k.length<=28};
 const isP=l=>{const k=key(l);return /^(pasos|preparaci|instrucciones|elaboraci|procedimiento|modo de)/.test(k)&&k.length<=28};
 const QTY=/^\s*[^\p{L}\p{N}]*(\d+[.,/]?\d*\s*(g|gr|kg|ml|l|cl|cdas?|cdtas?|tazas?|vasos?|uds?|unidades|dientes|lonchas|rebanadas)?\b|un[ao]?s?\b|medio|media|1\/2|una pizca|al gusto|pizca)/iu;
 const VERB=/^(mezcla|mezclar|vierte|verter|bate|batir|hornea|hornear|añade|añadir|pon|poner|mete|meter|cocina|cocinar|cocer|calienta|calentar|corta|cortar|pela|pelar|remueve|incorpora|deja|déjalo|déjala|precalienta|tritura|amasa|sirve|fríe|freír|saltea|hierve|cuece|agrega|une|forra|unta|engrasa|lava|escurre|coloca|monta|bate)\b/i;
 const WRAP=/\b(de|del|con|y|o|la|el|los|las|para|a|en|un|una|al|que|por|se|es|unas|unos|su|tu)$/i;
 const hasH=L.some(isI);
 const ing=[],pas=[];let mode='',title='';
 const push=(arr,c)=>{if(arr.length&&/^\p{L}/u.test(c)&&WRAP.test(arr[arr.length-1]))arr[arr.length-1]+=' '+c;else arr.push(c)};
 L.forEach(l=>{
  if(isI(l)){mode='i';return}
  if(isP(l)){mode='p';return}
  const c=clean(l);if(!c||(c.match(/\p{L}/gu)||[]).length<3)return;
  if(!title&&!/^\d{1,2}:\d{2}/.test(l)&&(c.match(/\p{L}/gu)||[]).length>=8&&c.length<=40&&/^\p{Lu}/u.test(c)){title=c.replace(/:$/,'');if(!hasH)return}
  if(mode=='i'&&(VERB.test(c)||(!QTY.test(l)&&c.length>45)))mode='p';
  if(mode=='i')push(ing,c);
  else if(mode=='p')push(pas,c);
  else if(hasH)return;
  else if(/^\s*\d+[.)]\s/.test(l)||c.length>70||VERB.test(c))push(pas,c);
  else if(QTY.test(l)||c.length<=45)push(ing,c);
  else push(pas,c);
 });
 $('#t').value=title;$('#ing').value=ing.join('\n');$('#pas').value=pas.join('\n');
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
